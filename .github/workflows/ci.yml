name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Tests (fixtures only, no network, no paid APIs)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed API keys
        run: |
          if git grep -nE '(sk-(proj-)?[A-Za-z0-9_-]{20,}|lsv2_[A-Za-z0-9_-]{20,})' -- ':!*.lock' ':!*package-lock.json'; then
            echo "Possible secret committed"; exit 1
          fi
